<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>SNS 업로드 스튜디오</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2313233b'/%3E%3Cpath d='M32 0v32H0z' fill='%231f4e8c'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <style>
      :root {
  --ink: #14233c;
  --ink-2: #33445e;
  --muted: #66758c;
  --line: #d6dee9;
  --line-2: #e7ecf3;
  --bg: #eef2f7;
  --panel: #ffffff;
  --sunken: #f5f7fb;
  --primary: #1f4e8c;
  --primary-hover: #183f73;
  --primary-ink: #ffffff;
  --primary-soft: #e4ecf7;
  --ok: #1d7552;
  --ok-soft: #e1f1e9;
  --warn: #9a6200;
  --warn-soft: #fbf1dc;
  --err: #b0342c;
  --err-soft: #f8e4e2;
  --run: #2563b5;
  --run-soft: #e3edfa;
  --fb: #1877f2;
  --ig: #c13584;
  --board: #13233b;
  --board-2: #1b3150;
  --board-ink: #dbe5f3;
  --board-muted: #8ea2bf;
  --focus: #3b82f6;
  --radius-s: 5px;
  --radius: 8px;
  --font: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --ink: #e4eaf4;
    --ink-2: #c4cedd;
    --muted: #8e9cb2;
    --line: #2c3a51;
    --line-2: #233047;
    --bg: #0f1829;
    --panel: #162236;
    --sunken: #121d2f;
    --primary: #4a86d6;
    --primary-hover: #5b95e2;
    --primary-ink: #0b1424;
    --primary-soft: #1d3150;
    --ok: #5cc795;
    --ok-soft: #173429;
    --warn: #e3ae4b;
    --warn-soft: #3a2d14;
    --err: #ee8379;
    --err-soft: #3d1d1b;
    --run: #78aef0;
    --run-soft: #1a2e4b;
    --board: #0b1322;
    --board-2: #15233a;
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --ink: #e4eaf4;
  --ink-2: #c4cedd;
  --muted: #8e9cb2;
  --line: #2c3a51;
  --line-2: #233047;
  --bg: #0f1829;
  --panel: #162236;
  --sunken: #121d2f;
  --primary: #4a86d6;
  --primary-hover: #5b95e2;
  --primary-ink: #0b1424;
  --primary-soft: #1d3150;
  --ok: #5cc795;
  --ok-soft: #173429;
  --warn: #e3ae4b;
  --warn-soft: #3a2d14;
  --err: #ee8379;
  --err-soft: #3d1d1b;
  --run: #78aef0;
  --run-soft: #1a2e4b;
  --board: #0b1322;
  --board-2: #15233a;
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}
h1,
h2,
h3,
h4 {
  margin: 0;
  line-height: 1.3;
  letter-spacing: -0.01em;
}
p {
  margin: 0 0 8px;
}
a {
  color: var(--primary);
}
code {
  font-size: 12.5px;
  background: var(--sunken);
  border: 1px solid var(--line-2);
  padding: 1px 5px;
  border-radius: 4px;
}
:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}
input[type='text'],
input[type='password'],
select,
textarea {
  width: 100%;
  font: inherit;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-s);
  padding: 7px 10px;
  min-height: 34px;
}
textarea {
  resize: vertical;
  line-height: 1.6;
}
input:focus,
select:focus,
textarea:focus {
  border-color: var(--primary);
  outline: none;
  box-shadow: 0 0 0 3px var(--primary-soft);
}
input:disabled,
textarea:disabled,
select:disabled {
  background: var(--sunken);
  color: var(--muted);
}
.muted {
  color: var(--muted);
}
.small {
  font-size: 12.5px;
}
.nowrap {
  white-space: nowrap;
}
.warn-text {
  color: var(--warn);
}
.err-text {
  color: var(--err);
}
.ic {
  flex: none;
}
.loading {
  padding: 80px;
  text-align: center;
  color: var(--muted);
}

/* ---------- 상단 ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 28px;
  height: 56px;
  padding: 0 24px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  font-size: 16px;
  letter-spacing: -0.02em;
  white-space: nowrap;
}
.brand-mark {
  width: 22px;
  height: 22px;
  border-radius: 5px;
  background: linear-gradient(135deg, var(--board) 0 50%, var(--primary) 50% 100%);
}
.tabs {
  display: flex;
  gap: 2px;
  height: 100%;
}
.tabs button {
  white-space: nowrap;
  font: inherit;
  font-weight: 600;
  color: var(--muted);
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  padding: 0 14px;
  cursor: pointer;
}
.tabs button:hover:not(:disabled) {
  color: var(--ink);
}
.tabs button.is-on {
  color: var(--ink);
  border-bottom-color: var(--primary);
}
.tabs button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.status {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  color: var(--muted);
  white-space: nowrap;
}
.status .dot + span + .dot {
  margin-left: 10px;
}
.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  display: inline-block;
}
.dot-ok {
  background: var(--ok);
}
.dot-off {
  background: var(--line);
  box-shadow: inset 0 0 0 1px var(--muted);
}

.main {
  max-width: 1480px;
  margin: 0 auto;
  padding: 20px 24px 60px;
}
.boot-err {
  max-width: 1480px;
  margin: 12px auto 0;
  padding: 0 24px;
}
.page {
  max-width: 1080px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ---------- 작업 레이아웃 ---------- */
.work {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 290px;
  gap: 20px;
  align-items: start;
}
.work-main {
  min-width: 0;
}
.step {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.stepper-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}
.stepper {
  display: flex;
  list-style: none;
  margin: 0;
  padding: 0;
  gap: 0;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.stepper li + li {
  border-left: 1px solid var(--line);
}
.stepper button {
  display: flex;
  align-items: center;
  gap: 8px;
  font: inherit;
  font-weight: 600;
  color: var(--muted);
  background: none;
  border: 0;
  padding: 9px 18px;
  cursor: pointer;
}
.stepper button:disabled {
  cursor: default;
}
.step-n {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 700;
  border: 1.5px solid currentColor;
}
.stepper li.is-past button {
  color: var(--ink-2);
}
.stepper li.is-past .step-n {
  background: var(--ink-2);
  border-color: var(--ink-2);
  color: var(--panel);
}
.stepper li.is-current {
  background: var(--primary-soft);
}
.stepper li.is-current button {
  color: var(--primary);
}
.stepper li.is-current .step-n {
  background: var(--primary);
  border-color: var(--primary);
  color: var(--primary-ink);
}

/* ---------- 섹션 ---------- */
.section {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  padding: 16px 20px 0;
}
.section-head h2 {
  font-size: 16px;
  font-weight: 700;
}
.section-desc {
  margin: 3px 0 0;
  color: var(--muted);
  font-size: 13px;
}
.section-right {
  flex: none;
}
.section-body {
  padding: 14px 20px 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.section-body > .btn,
.section-body > .check {
  align-self: flex-start;
}
.row-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px 16px;
}
.row-gap {
  display: flex;
  align-items: center;
  gap: 8px;
}
.row-gap.wrap {
  flex-wrap: wrap;
}
.row-end {
  display: flex;
  justify-content: flex-end;
}
.row-between {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
}
.field-label {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink-2);
}
.field-hint {
  font-size: 12px;
  color: var(--muted);
}
.secret {
  display: flex;
  gap: 6px;
}

/* ---------- 버튼 ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 34px;
  padding: 0 14px;
  font: inherit;
  font-weight: 600;
  font-size: 13.5px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover:not(:disabled) {
  border-color: var(--muted);
}
.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.btn-primary {
  background: var(--primary);
  border-color: var(--primary);
  color: var(--primary-ink);
}
.btn-primary:hover:not(:disabled) {
  background: var(--primary-hover);
  border-color: var(--primary-hover);
}
.btn-ghost {
  background: transparent;
  border-color: transparent;
  color: var(--ink-2);
}
.btn-ghost:hover:not(:disabled) {
  background: var(--sunken);
  border-color: var(--line-2);
}
.btn-danger {
  background: var(--err);
  border-color: var(--err);
  color: #fff;
}
.btn-danger-ghost {
  background: transparent;
  border-color: transparent;
  color: var(--err);
}
.btn-danger-ghost:hover:not(:disabled) {
  background: var(--err-soft);
}
.btn-sm {
  height: 28px;
  padding: 0 10px;
  font-size: 12.5px;
}
.btn-lg {
  height: 42px;
  padding: 0 20px;
  font-size: 15px;
}
.iconbtn {
  display: inline-grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border-radius: 4px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink-2);
  cursor: pointer;
  padding: 0;
}
.iconbtn:disabled {
  opacity: 0.35;
  cursor: default;
}
.iconbtn:hover:not(:disabled) {
  border-color: var(--muted);
}
.linklike {
  font: inherit;
  color: var(--primary);
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.linklike:disabled {
  color: var(--muted);
  cursor: default;
}

/* ---------- 체크·칩 ---------- */
.check {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
  min-height: 24px;
}
.check input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
}
.check-box {
  flex: none;
  width: 18px;
  height: 18px;
  border-radius: 4px;
  border: 1.5px solid var(--muted);
  display: grid;
  place-items: center;
  color: transparent;
  background: var(--panel);
}
.check input:checked + .check-box {
  background: var(--primary);
  border-color: var(--primary);
  color: var(--primary-ink);
}
.check input:focus-visible + .check-box {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}
.check.is-disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.check-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.check-strong .check-label {
  font-weight: 600;
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 22px;
  padding: 0 8px;
  border-radius: 11px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}
.pill-neutral {
  background: var(--sunken);
  color: var(--ink-2);
  border: 1px solid var(--line-2);
}
.pill-ok {
  background: var(--ok-soft);
  color: var(--ok);
}
.pill-wait {
  background: var(--warn-soft);
  color: var(--warn);
}
.pill-err {
  background: var(--err-soft);
  color: var(--err);
}
.pill-run {
  background: var(--run-soft);
  color: var(--run);
}

.ptag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-2);
  white-space: nowrap;
}
.ptag::before {
  content: '';
  width: 3px;
  height: 13px;
  border-radius: 2px;
}
.ptag-fb::before {
  background: var(--fb);
}
.ptag-ig::before {
  background: var(--ig);
}
.acct {
  color: var(--muted);
  font-size: 13px;
}

.notice {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  padding: 9px 12px;
  border-radius: var(--radius-s);
  font-size: 13px;
  line-height: 1.5;
}
.notice .ic {
  margin-top: 2px;
}
.notice-title {
  display: block;
  margin-bottom: 1px;
}
.notice-info {
  background: var(--primary-soft);
  color: var(--ink-2);
}
.notice-info .ic {
  color: var(--primary);
}
.notice-warn {
  background: var(--warn-soft);
  color: var(--ink);
}
.notice-warn .ic {
  color: var(--warn);
}
.notice-err {
  background: var(--err-soft);
  color: var(--ink);
}
.notice-err .ic {
  color: var(--err);
}

/* ---------- 1단계 ---------- */
.biz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 10px;
}
.biz-card {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  text-align: left;
  font: inherit;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px;
  cursor: pointer;
}
.biz-card:hover {
  border-color: var(--muted);
}
.biz-card.is-on {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
  background: var(--primary-soft);
}
.biz-name {
  font-size: 16px;
  font-weight: 700;
}
.biz-langs {
  font-size: 13px;
  color: var(--ink-2);
}
.biz-conn {
  font-size: 12px;
  color: var(--ok);
}
.biz-conn.is-partial {
  color: var(--warn);
}

.chan-table {
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line-2);
  border-radius: var(--radius-s);
}
.chan-row {
  display: grid;
  grid-template-columns: 140px 1fr 1fr;
  align-items: center;
  gap: 12px;
  padding: 8px 12px;
}
.chan-row + .chan-row {
  border-top: 1px solid var(--line-2);
}
.chan-lang {
  font-weight: 700;
}
.chan-off {
  font-size: 13px;
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.seg {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
  width: max-content;
}
.seg button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font: inherit;
  font-weight: 600;
  padding: 7px 14px;
  border: 0;
  background: var(--panel);
  color: var(--ink-2);
  cursor: pointer;
}
.seg button + button {
  border-left: 1px solid var(--line);
}
.seg button.is-on {
  background: var(--primary);
  color: var(--primary-ink);
}

.local-note {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  color: var(--muted);
  margin: 0;
}
.filebox {
  border: 1px solid var(--line-2);
  border-radius: var(--radius);
  background: var(--sunken);
}
.filebox-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 9px 12px;
}
.filebox-actions {
  display: flex;
  gap: 6px;
}
.drop {
  margin: 0 10px 10px;
  border: 1.5px dashed var(--line);
  border-radius: var(--radius-s);
  background: var(--panel);
  min-height: 84px;
}
.drop.is-over {
  border-color: var(--primary);
  background: var(--primary-soft);
}
.drop-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 84px;
  color: var(--muted);
  font-size: 13px;
  padding: 12px;
  text-align: center;
}
.files {
  list-style: none;
  margin: 0;
  padding: 10px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
  gap: 10px;
}
.files-video {
  grid-template-columns: minmax(200px, 320px);
}
.file {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.file-media {
  position: relative;
}
.file-media .thumb {
  width: 100%;
  aspect-ratio: 4 / 5;
  object-fit: cover;
  border-radius: 4px;
  border: 1px solid var(--line-2);
  background: var(--sunken);
  display: block;
}
.files-video .file-media .thumb {
  aspect-ratio: 16 / 9;
  object-fit: contain;
  background: #000;
}
.file-no {
  position: absolute;
  top: 5px;
  left: 5px;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  border-radius: 10px;
  background: var(--board);
  color: #fff;
  font-size: 11.5px;
  font-weight: 700;
  display: grid;
  place-items: center;
}
.file-rep {
  position: absolute;
  bottom: 5px;
  left: 5px;
  font-size: 11px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 3px;
  background: var(--primary);
  color: var(--primary-ink);
}
.file-info {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.file-name {
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.file-meta {
  font-size: 11.5px;
  color: var(--muted);
}
.file-tools {
  display: flex;
  gap: 4px;
}
.thumb-empty {
  background: var(--sunken);
  display: grid;
  place-items: center;
  color: var(--muted);
  font-size: 12px;
}

.lang-block {
  border-top: 1px solid var(--line-2);
  padding-top: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.lang-block.is-locked > :not(.lang-block-head):not(p) {
  opacity: 0.55;
}
.lang-block-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.lang-block-head h3 {
  font-size: 15px;
  font-weight: 700;
}
.sublang {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px;
  border: 1px solid var(--line-2);
  border-radius: var(--radius);
}
.sublang h4 {
  font-size: 14px;
}
.opts {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.opt {
  display: flex;
  flex-direction: column;
  gap: 6px;
  text-align: left;
  font: inherit;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
  cursor: pointer;
}
.opt:hover {
  border-color: var(--muted);
}
.opt.is-on {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}
.opt-tone {
  align-self: flex-start;
  font-size: 12px;
  font-weight: 700;
  color: var(--primary);
  background: var(--primary-soft);
  padding: 1px 8px;
  border-radius: 10px;
}
.opt-body {
  white-space: pre-wrap;
  font-size: 13px;
  line-height: 1.6;
  max-height: 220px;
  overflow: auto;
}
.opt-tags {
  font-size: 12px;
  color: var(--primary);
}
.editor {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 12px;
}
.editor:has(.editor-back) {
  grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
}
.editor-main {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.editor-back {
  display: flex;
  flex-direction: column;
  gap: 6px;
  background: var(--sunken);
  border: 1px solid var(--line-2);
  border-radius: var(--radius-s);
  padding: 10px 12px;
}
.back-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.back-text {
  white-space: pre-wrap;
  font-size: 13px;
  line-height: 1.6;
}
.back-stale {
  font-size: 12px;
  color: var(--warn);
  margin: 0;
}
.confirm-bar {
  display: flex;
  align-items: center;
  gap: 10px;
}
.editor.is-confirmed textarea,
.editor.is-confirmed input {
  border-color: var(--ok);
}

.step-foot {
  position: sticky;
  bottom: 12px;
  z-index: 5;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px 16px;
  box-shadow: 0 6px 24px -12px rgba(20, 35, 60, 0.35);
}
.todo {
  font-size: 13px;
  min-width: 0;
}
.todo ul {
  margin: 2px 0 0;
  padding-left: 18px;
  color: var(--ink-2);
}
.todo strong {
  font-size: 12.5px;
}
.todo.is-done,
.todo .is-done {
  color: var(--ok);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
}

/* ---------- 채널 현황 보드 ---------- */
.board {
  position: sticky;
  top: 76px;
  background: var(--board);
  color: var(--board-ink);
  border-radius: var(--radius);
  padding: 14px 14px 10px;
  max-height: calc(100vh - 96px);
  overflow: auto;
}
.board-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  padding: 0 2px 10px;
  border-bottom: 1px solid var(--board-2);
}
.board-head h2 {
  font-size: 14px;
  font-weight: 700;
  color: #fff;
}
.board-count {
  font-size: 12px;
  color: var(--board-muted);
}
.board-group {
  padding: 8px 0 4px;
}
.board-biz {
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  padding: 6px 2px 2px;
}
.board-lang {
  padding: 6px 0;
}
.board-lang + .board-lang {
  border-top: 1px solid var(--board-2);
}
.board-lang-name {
  font-size: 12px;
  color: var(--board-muted);
  padding: 0 2px 3px;
}
.board-row {
  display: grid;
  grid-template-columns: 10px 1fr auto;
  align-items: center;
  gap: 8px;
  padding: 3px 2px;
  font-size: 13px;
}
.board-light {
  width: 8px;
  height: 8px;
  border-radius: 2px;
  background: var(--board-muted);
}
.board-plat {
  color: var(--board-ink);
}
.board-state {
  font-size: 12px;
  color: var(--board-muted);
  text-align: right;
  max-width: 140px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tone-ok .board-light {
  background: #4fd197;
}
.tone-ok .board-state {
  color: #8fe3bc;
}
.tone-ready .board-light {
  background: #6aa7ff;
}
.tone-ready .board-state {
  color: #b6d2ff;
}
.tone-wait .board-light {
  background: #e8b04d;
}
.tone-err .board-light {
  background: #ff7b6e;
}
.tone-err .board-state {
  color: #ffb1a8;
}
.tone-run .board-light {
  background: #6aa7ff;
  animation: blink 1s steps(2, start) infinite;
}
.tone-off {
  opacity: 0.55;
}
.board-empty {
  font-size: 12.5px;
  color: var(--board-muted);
  margin: 10px 2px 2px;
}
.board .linklike {
  color: #b6d2ff;
}
@keyframes blink {
  to {
    visibility: hidden;
  }
}

/* ---------- 2단계 ---------- */
.summary-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 10px 16px;
}
.lang-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.lang-title {
  font-size: 15px;
  font-weight: 700;
  padding-left: 2px;
}
.ccards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 12px;
}
.ccard {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.ccard.is-checked {
  border-color: var(--ok);
}
.ccard.is-blocked {
  border-color: var(--err);
}
.ccard.is-done {
  background: var(--sunken);
}
.ccard-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line-2);
}
.ccard-title {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.ccard-title .acct {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ccard-done {
  padding: 12px 14px;
  font-size: 13px;
  color: var(--ink-2);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.strip {
  list-style: none;
  margin: 0;
  padding: 10px 14px;
  display: flex;
  gap: 6px;
  overflow-x: auto;
}
.strip li {
  position: relative;
  flex: none;
}
.strip .thumb {
  width: 64px;
  height: 80px;
  object-fit: cover;
  border-radius: 4px;
  border: 1px solid var(--line-2);
  display: block;
  background: var(--sunken);
}
.strip-video .thumb {
  width: 200px;
  height: 112px;
  object-fit: contain;
  background: #000;
}
.strip li.is-cta .thumb {
  outline: 2px solid var(--primary);
  outline-offset: -2px;
}
.strip-no {
  position: absolute;
  top: 3px;
  left: 3px;
  min-width: 17px;
  height: 17px;
  border-radius: 9px;
  background: var(--board);
  color: #fff;
  font-size: 10.5px;
  font-weight: 700;
  display: grid;
  place-items: center;
  padding: 0 4px;
}
.strip-tag {
  position: absolute;
  bottom: 3px;
  left: 3px;
  font-size: 10px;
  font-weight: 700;
  padding: 0 4px;
  border-radius: 3px;
  background: var(--primary);
  color: var(--primary-ink);
}
.strip-tag-cta {
  background: var(--board);
  color: #fff;
}
.ccard-opts {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
  padding: 0 14px 8px;
}
.thumb-pick {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.thumb-pick .thumb {
  width: 64px;
  height: 36px;
  object-fit: cover;
  border-radius: 3px;
}
.ccard-caption {
  padding: 4px 14px 10px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.cap-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.cap-count {
  display: flex;
  gap: 10px;
  font-size: 12px;
  color: var(--muted);
}
.cap-count .over {
  color: var(--err);
  font-weight: 700;
}
.ccard-msgs {
  padding: 0 14px 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.ccard > .muted.small {
  padding: 0 14px 8px;
  margin: 0;
}
.ccard-foot {
  margin-top: auto;
  padding: 10px 14px;
  border-top: 1px solid var(--line-2);
  background: var(--sunken);
  border-radius: 0 0 var(--radius) var(--radius);
}
.modal-list {
  margin: 8px 0 0;
  padding-left: 18px;
  max-height: 260px;
  overflow: auto;
  font-size: 13px;
}

/* ---------- 3단계 ---------- */
.result-hero {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-left: 4px solid var(--ok);
  border-radius: var(--radius);
  padding: 16px 20px;
}
.result-hero.has-fail {
  border-left-color: var(--err);
}
.result-hero h2 {
  font-size: 18px;
}
.result-hero p {
  margin: 4px 0 0;
  color: var(--muted);
}
.table-wrap {
  overflow-x: auto;
}
.result-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  font-size: 13px;
}
.result-table th {
  text-align: left;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  background: var(--sunken);
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
}
.result-table td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--line-2);
  vertical-align: top;
}
.result-table tr:last-child td {
  border-bottom: 0;
}
.result-table tr.is-fail td {
  background: color-mix(in srgb, var(--err-soft) 45%, transparent);
}
.extlink {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-weight: 600;
}
.fail-detail {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

/* ---------- 설정 ---------- */
.mini-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.mini-table th,
.mini-table td {
  text-align: left;
  padding: 7px 10px;
  border-bottom: 1px solid var(--line-2);
  vertical-align: top;
}
.mini-table thead th {
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
}
.mini-table tbody th {
  width: 34%;
  font-weight: 600;
}
.biz-set {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.biz-set-head {
  display: flex;
  align-items: center;
  gap: 12px;
}
.biz-set-name {
  max-width: 280px;
  font-size: 16px !important;
  font-weight: 700;
}
.lang-row {
  border: 1px solid var(--line-2);
  border-radius: var(--radius-s);
  background: var(--sunken);
}
.lang-row summary {
  display: grid;
  grid-template-columns: 12px 130px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  cursor: pointer;
  list-style: none;
}
.lang-row summary::-webkit-details-marker {
  display: none;
}
.lang-row summary::before {
  content: '';
  width: 7px;
  height: 7px;
  border-right: 1.8px solid var(--muted);
  border-bottom: 1.8px solid var(--muted);
  transform: rotate(-45deg);
  justify-self: center;
}
.lang-row[open] summary::before {
  transform: rotate(45deg);
}
.lang-row[open] summary {
  border-bottom: 1px solid var(--line-2);
}
.lang-row-name {
  font-weight: 700;
}
.lang-row-sum {
  font-size: 13px;
  color: var(--ink-2);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.lang-row-plat {
  display: flex;
  gap: 4px;
}
.lang-row-body {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: var(--panel);
  border-radius: 0 0 var(--radius-s) var(--radius-s);
}
.cta-slot {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.cta-box {
  display: flex;
  align-items: center;
  gap: 10px;
}
.cta-box .thumb {
  width: 56px;
  height: 70px;
  object-fit: cover;
  border-radius: 4px;
  border: 1px solid var(--line-2);
}
.cta-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.glossary summary {
  cursor: pointer;
  font-weight: 600;
  padding: 4px 0;
}
.gl-wrap {
  overflow-x: auto;
  margin: 6px 0;
}
.gl-table {
  border-collapse: collapse;
  min-width: 720px;
  width: 100%;
}
.gl-table th {
  font-size: 12px;
  color: var(--muted);
  text-align: left;
  font-weight: 600;
  padding: 4px;
}
.gl-table td {
  padding: 3px;
}
.gl-table input {
  min-height: 30px;
  padding: 4px 8px;
}

/* ---------- 이력 ---------- */
.empty {
  color: var(--muted);
  padding: 20px 0;
  text-align: center;
}
.recent-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 10px;
}
.recent {
  border: 1px solid var(--line-2);
  border-radius: var(--radius-s);
  padding: 10px 12px;
}
.recent ul {
  margin: 6px 0 0;
  padding: 0;
  list-style: none;
  font-size: 12.5px;
}
.recent li {
  padding: 3px 0;
  display: flex;
  gap: 6px;
  min-width: 0;
}
.recent-text {
  color: var(--ink-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ---------- 가이드 ---------- */
.guide h3 {
  font-size: 14.5px;
  margin: 8px 0 2px;
}
.guide ol,
.guide ul {
  margin: 0;
  padding-left: 20px;
}
.guide li {
  margin: 3px 0;
}
.guide p,
.guide li {
  max-width: 78ch;
}

/* ---------- 모달·토스트 ---------- */
.modal-back {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(12, 22, 40, 0.5);
  display: grid;
  place-items: center;
  padding: 16px;
}
.modal {
  width: min(520px, 100%);
  background: var(--panel);
  border-radius: 10px;
  border: 1px solid var(--line);
  padding: 20px 22px 16px;
  box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.45);
}
.modal h3 {
  font-size: 17px;
  margin-bottom: 8px;
}
.modal-body {
  color: var(--ink-2);
  font-size: 14px;
}
.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 16px;
}
.toasts {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 110;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: min(420px, calc(100vw - 40px));
}
.toast {
  background: var(--board);
  color: #fff;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13.5px;
  box-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.5);
  border-left: 4px solid #6aa7ff;
}
.toast-ok {
  border-left-color: #4fd197;
}
.toast-warn {
  border-left-color: #e8b04d;
}
.toast-err {
  border-left-color: #ff7b6e;
}

/* ---------- 반응형 ---------- */
@media (max-width: 1100px) {
  .work {
    grid-template-columns: minmax(0, 1fr);
  }
  .board {
    position: static;
    max-height: none;
  }
  .opts {
    grid-template-columns: minmax(0, 1fr);
  }
}
@media (max-width: 760px) {
  .topbar {
    height: auto;
    flex-wrap: wrap;
    gap: 8px 16px;
    padding: 10px 16px 0;
  }
  .tabs {
    order: 3;
    width: 100%;
    overflow-x: auto;
    height: 40px;
  }
  .status {
    margin-left: auto;
  }
  .main {
    padding: 14px 16px 60px;
  }
  .row-2,
  .editor:has(.editor-back) {
    grid-template-columns: minmax(0, 1fr);
  }
  .chan-row {
    grid-template-columns: 1fr;
    gap: 6px;
  }
  .stepper-bar,
  .step-foot,
  .result-hero,
  .summary-bar {
    flex-direction: column;
    align-items: stretch;
  }
  .ccards {
    grid-template-columns: minmax(0, 1fr);
  }
  .lang-row summary {
    grid-template-columns: 12px minmax(0, 1fr) auto;
  }
  .lang-row-sum {
    grid-column: 2 / -1;
  }
}
@media (prefers-reduced-motion: reduce) {
  .tone-run .board-light {
    animation: none;
  }
}
